// Waybar config (JSONC).
//
// Every module below is a *native* waybar module. They are event driven
// (sway IPC, PulseAudio/PipeWire, MPD idle, D-Bus, udev) or poll internally
// without spawning processes. The old setup ran ~10 bash scripts every
// second, each forking cat/grep/awk/bc/jq/swaymsg; that kept the CPU awake
// all the time and was the main reason the bar felt slow and ate battery.
//
// Icons are Font Awesome 4 code points (shipped in ~/.fonts, also present
// in every Nerd Font).
{
	"layer": "top",
	"position": "top",
	"height": 26,
	"spacing": 4,
	"reload_style_on_change": true,

	"modules-left": [
		"sway/workspaces",
		"sway/mode",
		"sway/scratchpad"
	],
	"modules-right": [
		"mpd",
		"idle_inhibitor",
		"pulseaudio",
		"backlight",
		"network",
		"bluetooth",
		"cpu",
		"memory",
		"disk",
		"power-profiles-daemon",
		"battery",
		"sway/language",
		"clock",
		"tray"
	],

	// ---------------------------------------------------------------- sway
	"sway/workspaces": {
		"disable-scroll-wraparound": true
	},
	"sway/mode": {
		"format": "<span style=\"italic\">{}</span>"
	},
	"sway/scratchpad": {
		"format": "{icon} {count}",
		"show-empty": false,
		"format-icons": ["", ""],
		"tooltip": true,
		"tooltip-format": "{app}: {title}"
	},
	// Event driven; replaces the old "swaymsg | jq" poll every second.
	"sway/language": {
		"format": " {short}",
		"tooltip-format": "{long}",
		"on-click": "swaymsg input type:keyboard xkb_switch_layout next"
	},

	// --------------------------------------------------------------- media
	"mpd": {
		"format": "{stateIcon} {artist} - {title}",
		"format-stopped": "",
		"format-disconnected": "",
		"max-length": 45,
		"state-icons": {
			"paused": "",
			"playing": ""
		},
		"tooltip-format": "{album}\n{elapsedTime:%M:%S} / {totalTime:%M:%S}",
		"tooltip-format-disconnected": "MPD is not running",
		"on-click": "mpc -q toggle",
		"on-scroll-up": "mpc -q prev",
		"on-scroll-down": "mpc -q next"
	},
	"pulseaudio": {
		"format": "{icon} {volume}%",
		"format-muted": " muted",
		"format-bluetooth": "{icon} {volume}%",
		"format-icons": {
			"headphone": "",
			"default": ["", "", ""]
		},
		"scroll-step": 5,
		"max-volume": 100,
		"tooltip-format": "{desc}\nClick: mute  |  Right click: mixer",
		"on-click": "pamixer -t",
		"on-click-right": "pavucontrol"
	},

	// ------------------------------------------------------------- display
	"idle_inhibitor": {
		"format": "{icon}",
		"format-icons": {
			"activated": "",
			"deactivated": ""
		},
		"tooltip-format-activated": "Screen stays on (auto lock disabled)",
		"tooltip-format-deactivated": "Auto lock / screen off enabled"
	},
	// Hidden automatically on machines without a backlight.
	"backlight": {
		"format": "{icon} {percent}%",
		"format-icons": ["", ""],
		"scroll-step": 5,
		"tooltip": false
	},

	// ------------------------------------------------------------- network
	// Picks the interface of the default route automatically (wifi or
	// ethernet), so no hard-coded enp1s0 / wlp1s0 any more.
	"network": {
		"interval": 5,
		"format-wifi": " {essid}",
		"format-ethernet": " {ipaddr}",
		"format-linked": " no IP",
		"format-disconnected": " offline",
		"format-alt": " {bandwidthDownBytes}  {bandwidthUpBytes}",
		"tooltip-format": "{ifname}: {ipaddr}/{cidr}\nGateway: {gwaddr}\n {bandwidthDownBytes}   {bandwidthUpBytes}",
		"tooltip-format-wifi": "{essid} ({signalStrength}%, {frequency} GHz)\n{ifname}: {ipaddr}/{cidr}\n {bandwidthDownBytes}   {bandwidthUpBytes}\nClick: show traffic",
		"tooltip-format-disconnected": "No network connection"
	},
	// D-Bus driven; hidden when there is no bluetooth adapter.
	"bluetooth": {
		"format": "",
		"format-off": "",
		"format-disabled": "",
		"format-no-controller": "",
		"format-connected": " {num_connections}",
		"tooltip-format": "Bluetooth: {status}",
		"tooltip-format-connected": "{device_enumerate}",
		"tooltip-format-enumerate-connected": "{device_alias}",
		"on-click": "alacritty -e bluetoothctl"
	},

	// -------------------------------------------------------------- system
	"cpu": {
		"interval": 10,
		"format": " {load:0.2f}",
		"tooltip-format": "CPU usage: {usage}%",
		"states": {
			"warning": 70,
			"critical": 90
		}
	},
	"memory": {
		"interval": 15,
		"format": " {avail:0.1f}G",
		"tooltip-format": "Used {used:0.1f}G of {total:0.1f}G ({percentage}%)\nSwap {swapUsed:0.1f}G",
		"states": {
			"warning": 80,
			"critical": 90
		}
	},
	"disk": {
		"interval": 300,
		"path": "/home",
		"format": " {free}",
		"tooltip-format": "{path}: {used} of {total} used ({percentage_used}%)",
		"states": {
			"critical": 90
		}
	},

	// --------------------------------------------------------------- power
	// Click to cycle: power-saver -> balanced -> performance.
	"power-profiles-daemon": {
		"format": "{icon}",
		"tooltip-format": "Power profile: {profile}\nClick to change",
		"format-icons": {
			"default": "",
			"performance": "",
			"balanced": "",
			"power-saver": ""
		}
	},
	// Hidden automatically on desktops.
	"battery": {
		"interval": 60,
		"states": {
			"warning": 25,
			"critical": 10
		},
		"format": "{icon} {capacity}%",
		"format-charging": " {capacity}%",
		"format-plugged": " {capacity}%",
		"format-full": " {capacity}%",
		"format-icons": ["", "", "", "", ""],
		"tooltip-format": "{timeTo}\nDrain: {power:0.1f} W"
	},

	// ---------------------------------------------------------------- time
	// One module instead of two scripts; date + time, calendar on hover,
	// scroll over the tooltip to change month.
	"clock": {
		"interval": 60,
		"format": " {:%a %d %b  %H:%M}",
		"tooltip-format": "<tt><small>{calendar}</small></tt>",
		"calendar": {
			"mode": "month",
			"weeks-pos": "right",
			"on-scroll": 1,
			"format": {
				"today": "<span color='#ffcc66'><b><u>{}</u></b></span>",
				"weeks": "<span color='#99ffdd'><b>W{}</b></span>"
			}
		},
		"actions": {
			"on-click-right": "mode",
			"on-scroll-up": "shift_up",
			"on-scroll-down": "shift_down"
		}
	},

	"tray": {
		"icon-size": 16,
		"spacing": 8
	}
}
